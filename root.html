
<up-down-counter>
    <template shadowrootmode="open"><!--begin--><!--begin-->
        <template onload=blow-dry-to-head>
            <script type=module>
                import 'up-down-counter/Count-Mount.js';
            </script>
        </template>
        <style adopt>
            :host{
                display: block;
            }
            * {
              font-size: 100%;
            }
        
            span {
              width: 4rem;
              display: inline-block;
              text-align: center;
            }
        
            button {
              width: 4rem;
              height: 4rem;
              border: none;
              border-radius: 10px;
              background-color: seagreen;
              color: white;
            }
        </style>
        <button part=down data-d=-1>-</button><data part=count></data><button part=up data-d=1>+</button>
    
<xtal-element
 inherits=counter-o 
 prop-defaults='{
   "count": 30000
}'
 xform='{
   "% count": "localize",
   "button": {
      "m": {
         "on": "click",
         "inc": "count",
         "byAmt": ".dataset.d"
      }
   }
}' 
 actions='{
   "onCount": {
      "ifAllOf": [
         "count"
      ]
   }
}' 
></xtal-element>
<!--end--><!--end-->
</template>
</up-down-counter>
