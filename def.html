<xtal-element
 inherits=counter-o 
 prop-defaults='{
   "count": 30000
}'
 xform='{
   "% count": "localize",
   "button": {
      "m": {
         "on": "click",
         "inc": "count",
         "byAmt": ".dataset.d"
      }
   }
}' 
 actions='{
   "onCount": {
      "ifAllOf": [
         "count"
      ]
   }
}' 
></xtal-element>
