<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>up-down-counter — dev</title>
    <!-- #include virtual="/imports.html" -->
    <script type=module>
        import 'be-hive/be-hive.js';
        import 'imp-h/imp-h.js';
        import 'el-maker/def.js';
    </script>
</head>
<body>
    <be-hive></be-hive>

    <form>
        <up-down-counter name=widgets imp-h="up-down-counter/root.html">
            <script type=precede data-extends=el-maker src="up-down-counter/el-maker.json"></script>
        </up-down-counter>
    </form>

    <!-- Non-default starting count via attribute -->
    <up-down-counter count=5>
    </up-down-counter>
</body>
</html>
