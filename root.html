<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>up-down-counter</title>
</head>
<body>
    <up-down-counter>
        <template shadowrootmode="open"><?start><?start>
            <style adopt>
                :host {
                    display: block;
                }
                * {
                    font-size: 200%;
                }
                data {
                    width: 4rem;
                    display: inline-block;
                    text-align: center;
                }
                button {
                    width: 4rem;
                    height: 4rem;
                    border: none;
                    border-radius: 10px;
                    background-color: seagreen;
                    color: white;
                }
            </style>
            <button part=down type=button aria-label="Decrement">-</button><data part=count>30,000</data><button part=up type=button aria-label="Increment">+</button>
        <?end><?end></template>
    </up-down-counter>
</body>
</html>
